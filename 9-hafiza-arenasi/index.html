<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚔️ HAFIZA ARENASI - Siber Zeka Düellosu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Arkaplandaki Işıklar -->
    <div class="isik isik-mor"></div>
    <div class="isik isik-mavi"></div>

    <!-- Ana Oyun Kartı -->
    <div class="arena-kutusu">
      <!-- Başlık -->
      <div class="baslik-alani">
        <h1>⚔️ HAFIZA <span>ARENASI</span></h1>
        <p class="alt-baslik">⚡Siber Zeka Düellosu⚡</p>
      </div>

      <!-- Bilgi Panneli -->
      <div class="panel">
        <div class="hamle-kutusu">🎯 Hamle: <span id="hamle-sayaci">0</span></div>
        <button id="yeniden-butonu">Yeniden Başlat 🔄</button>
      </div>

      <!-- 4X4 Izgara: Javascript burayı dolduracak -->
      <div id="oyun-alani"></div>

      <!-- Kazanma Mesajı -->
      <div id="mesaj-kutusu"></div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
